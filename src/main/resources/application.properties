spring.application.name=sistema-avaliacoes

# Conexão com o PostgreSQL local (ajuste usuário/senha se o de vocês for diferente)
spring.datasource.url=jdbc:postgresql://localhost:5432/avaliacoes
spring.datasource.username=postgres
spring.datasource.password=postgres

# O banco é criado pelos scripts em database/ (rodados à mão), não pelo Spring
spring.sql.init.mode=never

server.port=8080

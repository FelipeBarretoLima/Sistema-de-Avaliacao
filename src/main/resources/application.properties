spring.application.name=sistema-avaliacoes

# Lê as variáveis do arquivo .env na raiz do projeto (se existir)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/avaliacoes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=never
server.port=8080